[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
white = #FFFFFF
alert = #A54242
disabled = #707880

[bar/example]
width = 100%
height = 24pt
radius = 6

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "FiraCode Nerd Font:size=11;1"

modules-left = xworkspaces
modules-right = filesystem pulseaudio xkeyboard memory cpu wlan eth battery date powermenu 

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = "  %name%"
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = "  %name%"
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = "  %name%"
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1


[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

# label-mounted =  %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

format-mounted = "  <label-mounted>"
format-unmounted = "  <label-unmounted>"
format-mounted-foreground = ${colors.primary}
format-unmounted-foreground = ${colors.primary}
label-mounted = %percentage_free%% of %total%
label-mounted-foreground = ${colors.white}

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "  "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = "  muted"
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

format = "  <label-layout>"
format-foreground = ${colors.primary}
label-layout = "%layout%"
label-layout-foreground = ${colors.foreground}
label-indicator-padding = 2
label-indicator-margin = 1

[module/memory]
type = internal/memory
interval = 2
format-prefix = "Ram "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "Cpu "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5

[module/wlan]
inherit = network-base
interface-type = wireless
format-connected = "  <label-connected>"
format-disconnected = "󰖪  <label-disconnected>"
format-connected-foreground = ${colors.primary}
format-disconnected-foreground = ${colors.primary}
label-connected = "%essid%"
label-disconnected = disconnected
label-connected-foreground = ${colors.white}
label-disconnected-foreground = ${colors.disabled}

[module/eth]
inherit = network-base
interface-type = wired
format-connected = "  <label-connected>"
format-disconnected = "󰅛  <label-disconnected>"
format-connected-foreground = ${colors.primary}
format-disconnected-foreground = ${colors.primary}
label-connected = "%essid%"
label-disconnected = disconnected
label-connected-foreground = ${colors.white}
label-disconnected-foreground = ${colors.disabled}

[module/hijri]
# label = 󰃭
type = custom/script

; Available tokens:
;   %counter%
; Command to be executed (using "/bin/sh -c [command]")
exec = date +%Y%m%d | xargs ical --gregorian | head -n 1 | sed 's/^\s*//'

; Conditional command that, if defined, needs to exit successfully
; before the main exec command is invoked.
; Default: ""
; exec-if = pgrep -x myservice

; Set this to true for scripts that continuously produce output
; If set to 'true', everytime the script produces a new line of output, the module updates.
; Otherwise, only the first line of output is considered and all later lines are discarded.
; Default: false
; tail = true

; Seconds to sleep between updates
; Default: 5 (0 if `tail = true`)
interval = 90

; Interval used when the `exec` command returns with a non-zero exit code 
; If not defined, interval is used instead
; New in version 3.7.0
; Default: (same as interval)
interval-fail = 300

; Seconds to sleep between `exec-if` invocations
; If not defined, interval is used instead
; New in version 3.7.0
; Default: (same as interval)
interval-if = 180

; Set environment variables in the 'exec' script
; New in version 3.6.0
; env-NAME = VALUE
; env-FOO = BAR

; Available tags:
;   <label> (default)
format = <label>
format-prefix = "Hijri "
# format-background = #999
# label-foreground = ${colors.secondary}
format-prefix-foreground = ${colors.primary}
format-foreground = ${colors.foreground}
# foreground = ${colors.secondary}
; format-padding = 4

; Format used when the `exec` command returns with a non-zero exit code 
; Only used with `tail = false`
; If not defined, format is used instead.
; Available tags:
;   <label-fail>
; New in version 3.6.0
; format-fail = <label-fail>

; Available tokens:
;   %output%
; Default: %output%
; label = %output:0:15:...%

; Available tokens:
;   %output%
; Default: %output%
; New in version 3.6.0
; label-fail = %output:0:15:...%

; Available tokens:
;   %counter%
;   %pid%
;
; "click-(left|middle|right)" will be executed using "/bin/sh -c [command]"

; format = <label>
; click-left = echo left %counter%
; click-middle = echo middle %counter%
; click-right = echo right %counter%
; double-click-left = echo double left %counter%
; double-click-middle = echo double middle %counter%
; double-click-right = echo double right %counter%

; Available tokens:
;   %counter%
;   %pid%
;
; "scroll-(up|down)" will be executed using "/bin/sh -c [command]"
scroll-up = echo scroll up %counter%
scroll-down = echo scroll down %counter%

[module/date]
type = internal/date
interval = 1

date = %I:%M %p
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/battery]
type = internal/battery

; This is useful in case the battery never reports 100% charge
; Default: 100
full-at = 99

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 5

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP0

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
; Default: 5
poll-interval = 5
format-charging = "  <label-charging>"
format-discharging = "<ramp-capacity> <label-discharging>"
format-charging-foreground = ${colors.primary}
format-discharging-foreground = ${colors.primary}
format-full = "  %percentage%%"
format-low = "  %percentage%%"
label-charging = %percentage%%
label-charging-padding = 1
label-discharging-padding = 1
label-discharging = %percentage%%
label-foreground = ${colors.white}
label-charging-foreground = ${colors.white}
label-discharging-foreground = ${colors.white}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

[module/powermenu]
type = custom/menu
expand-right = false

; Add padding for nicer spacing
format-padding = 1
label-padding = 1

label-open = Power
label-close = x
label-separator = "  "


menu-0-0 = Shutdown
menu-0-0-exec = shutdown now

menu-0-1 = Reboot
menu-0-1-exec = reboot

; vim:ft=dosini
