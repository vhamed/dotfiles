---
- name: Setup my dotfiles
  hosts: all 
  vars_files:
    - "../vars/vault.yml"
  pre_tasks:
    - name: Detect WSL
      ansible.builtin.import_tasks: "../pre_tasks/detect_wsl.yml"
      tags: [always]
  roles:
    - role: GROG.package
      become: yes
    - role: geerlingguy.docker
      become: yes
    - role: ssh 
    - role: git 
    - role: zsh 
    - role: tmux 
    - role: nvim 
    - role: fnm 
