---
- name: Setup my dotfiles
  hosts: all 
  pre_tasks:
    - name: Detect WSL
      import_tasks: ../pre_tasks/detect_wsl.yml
      tags: [always]
  roles:
    - role: GROG.package
      become: yes
      tags: [packages]
    - role: geerlingguy.docker
      become: yes
      tags: [docker]
    - role: secrets
      tags: [secrets]
    - role: git
      tags: [git]
    - role: tmux
      tags: [tmux]
    - role: nvim
      tags: [nvim]
