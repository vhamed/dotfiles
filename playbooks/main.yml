---
- name: Setup my dotfiles
  hosts: all 
  pre_tasks:
    - name: Detect WSL
      ansible.builtin.import_tasks: ../pre_tasks/detect_wsl.yml
      tags: [always]
  roles:
    - role: GROG.package
      become: yes
      tags: [packages]
    - role: geerlingguy.docker
      become: yes
      tags: [docker]
    - role: ssh
      tags: [ssh]
    - role: git
      tags: [git]
    - role: zsh
      tags: [zsh]
    - role: tmux
      tags: [tmux]
    - role: nvim
      tags: [nvim]
    # - role: fnm
    #   tags: [fnm]
