- name: "SSH | Ensure .ssh directory exists"
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.ssh"
    state: directory
    mode: "0700"

- name: Debug ansible_user_dir
  ansible.builtin.debug:
    var: ansible_user_dir

- name: "SSH | Deploy private key"
  ansible.builtin.copy:
    content: "{{ lookup('file', '{{ role_path }}/files/pr') }}\n"
    dest: "{{ ansible_user_dir }}/.ssh/id_ed25519"
    mode: "0600"
  no_log: true

- name: "SSH | Deploy public key"
  ansible.builtin.copy:
    content: "{{ lookup('file', '{{ role_path }}/files/pb') }}"
    dest: "{{ ansible_user_dir }}/.ssh/id_ed25519.pub"
    mode: "0644"
  no_log: true
