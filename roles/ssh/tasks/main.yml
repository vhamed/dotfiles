- name: "Ensure .ssh directory exists"
  file:
    path: "{{ ansible_user_dir }}/.ssh"
    state: directory
    mode: '0700'

- name: Debug ansible_user_dir
  debug:
    var: ansible_user_dir

- name: "Copy private keys"
  template:
    src: "{{ role_path }}/files/{{ item.src }}"
    dest: "{{ ansible_user_dir }}/.ssh/{{ item.dest }}"
    mode: '0600'
    owner: "{{ ansible_env.USER }}"
    group: "{{ ansible_env.USER }}"
  loop:
    - { src: "private",   dest: "id_ed25519" }
    - { src: "quds_private",   dest: "quds" }
    - { src: "andalus_private",   dest: "andalus" }
  loop_control:
    label: "{{ item.dest }}"

- name: "Copy public keys"
  template:
    src: "{{ role_path }}/files/{{ item.src }}"
    dest: "{{ ansible_user_dir }}/.ssh/{{ item.dest }}"
    mode: '0644'
    owner: "{{ ansible_env.USER }}"
    group: "{{ ansible_env.USER }}"
  loop:
    - { src: "public",   dest: "id_ed25519.pub" }
    - { src: "quds_public",   dest: "quds.pub" }
    - { src: "andalus_public",   dest: "andalus.pub" }
  loop_control:
    label: "{{ item.dest }}"
