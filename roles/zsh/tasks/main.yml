---
- name: Copy content of secret file to ~/.secrets
  copy:
    src: "{{ role_path }}/files/secrets"
    dest: ~/.secrets
    mode: 0600
    owner: "{{ ansible_env.USER }}"
    group: "{{ ansible_env.USER }}"
    force: true

- name: "Ensure default shell is zsh"
  become: yes
  when: lookup('env', 'USER') != "root"
  user:
    name: "{{ lookup('env', 'USER') }}"
    shell: /usr/bin/zsh
